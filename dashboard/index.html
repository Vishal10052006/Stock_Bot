<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOCK_BOT — V1 Human Review</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8eef3;background:#070b10;--panel:#0d141b;--line:#1e2a34;--muted:#82909b;--cyan:#61d8ff;--green:#61e294;--red:#ff7180;--yellow:#f0cf67}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#14222d 0,#070b10 42%);min-height:100vh}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px;background:#080d12cc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:2}
.brand{font-weight:800;letter-spacing:.08em}.sub{color:var(--muted);font-size:12px}.spacer{flex:1}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font:11px ui-monospace,monospace}.locked{color:var(--red);border-color:#5b2730}
main{max-width:1180px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:1.45fr .85fr;gap:16px}.panel{background:linear-gradient(180deg,#0f171f,#0b1117);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 16px 50px #0006}.full{grid-column:1/-1}
.kicker{font:11px ui-monospace,monospace;color:var(--muted);letter-spacing:.08em}.symbol{font-size:30px;font-weight:800;margin:7px 0}.time{color:var(--muted);font:12px ui-monospace,monospace}
.signal{font-size:54px;font-weight:900;letter-spacing:.04em}.BUY{color:var(--green)}.SELL{color:var(--red)}.WAIT{color:var(--yellow)}
.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.metric{min-width:110px}.metric b{display:block;font-size:20px;margin-top:4px}.muted{color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.level{border:1px solid var(--line);border-radius:10px;padding:12px}.level b{display:block;font-size:18px;margin-top:4px}
.section{margin-top:18px}.section h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px}.support{border-color:#285f3b;color:var(--green)}.contra{border-color:#69313a;color:var(--red)}
.evidence{display:grid;gap:8px}.e{border:1px solid var(--line);border-radius:9px;padding:11px}.e .top{display:flex;justify-content:space-between;gap:10px;font-size:12px}.e .reason{margin-top:6px;font-size:13px}.e .meta{margin-top:5px;color:var(--muted);font:10px ui-monospace,monospace}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px;font-size:12px;padding:7px 0;border-bottom:1px solid #162029}.kv:last-child{border:0}.kv b{color:var(--muted)}
.state{font-weight:700}.ok{color:var(--green)}.warn{color:var(--yellow)}
pre{white-space:pre-wrap;overflow:auto;max-height:330px;background:#080c11;border:1px solid var(--line);border-radius:9px;padding:12px;color:#9cacb8;font:11px ui-monospace,monospace}
.empty{text-align:center;padding:48px 10px;color:var(--muted)}
footer{max-width:1180px;margin:18px auto 40px;padding:0 20px;color:var(--muted);font:11px ui-monospace,monospace}
@media(max-width:800px){.grid{grid-template-columns:1fr}.levels{grid-template-columns:repeat(2,1fr)}header{padding:0 14px}.sub{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">STOCK_BOT</div><div class="sub">VERSION 1 / REAL-MONEY MANUAL REVIEW</div><div class="spacer"></div>
  <span class="badge locked">MANUAL BUY/SELL • BROKER AUTOMATION: OFF</span><span class="badge" id="fresh">WAITING</span>
</header>
<main>
  <div id="root" class="empty">Waiting for the canonical V1 real-money decision…</div>
</main>
<footer>REAL-MONEY DECISION SUPPORT • BUY/SELL/WAIT FOR MANUAL EXECUTION • NO ORDER COMMANDS • NO BROKER ORDER COMMANDS</footer>
<script>
"use strict";
const root=document.getElementById("root"),fresh=document.getElementById("fresh");
const esc=v=>String(v??"—").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=v=>v==null?"—":(Number(v)*100).toFixed(1)+"%";
const price=v=>v==null?"—":Number(v).toFixed(2);
function evidence(list){
  if(!Array.isArray(list)||!list.length)return '<div class="muted">No evidence published for this category.</div>';
  return '<div class="evidence">'+list.map(e=>'<div class="e"><div class="top"><b>'+esc(e.category)+' / '+esc(e.source)+'</b><span>'+esc(e.status)+'</span></div><div class="reason">'+esc(e.reason)+'</div><div class="meta">'+esc(e.timestamp)+'</div></div>').join("")+'</div>';
}
function pills(items,cls){return Array.isArray(items)&&items.length?'<div class="pills">'+items.map(x=>'<span class="pill '+cls+'">'+esc(x)+'</span>').join("")+'</div>':'<span class="muted">None recorded.</span>'}
function render(s){
 const v=s.v1_signal || (s.views&&s.views.v1_signal);
 const row=s.views&&s.views.scanner&&s.views.scanner.rows&&s.views.scanner.rows[0];
 if(!v){
   root.className="empty";root.textContent=(s.views&&s.views.scanner&&s.views.scanner.status)||"Waiting for the canonical V1 signal…";return;
 }
 const sig=String(v.signal||"WAIT"), cls=sig==="BUY"?"BUY":sig==="SELL"?"SELL":"WAIT";
 const probs=v.prediction_evidence&&v.prediction_evidence.probabilities||{};
 const p={LONG_SUCCESS:probs.LONG_SUCCESS,SHORT_SUCCESS:probs.SHORT_SUCCESS,NO_EDGE:probs.NO_EDGE};
 const risk=(v.risk_conditions||[]).map(x=>'<div class="pill">'+esc(x)+'</div>').join("");
 const prov=Object.entries(v.provenance||{}).map(([k,val])=>'<div class="kv"><b>'+esc(k)+'</b><span>'+esc(val)+'</span></div>').join("");
 root.className="grid";
 root.innerHTML=
 '<section class="panel">'+
   '<div class="kicker">CANONICAL SIGNAL</div><div class="symbol">'+esc(v.symbol)+'</div><div class="time">'+esc(v.timestamp)+'</div>'+
   '<div class="row" style="margin-top:18px"><div class="signal '+cls+'">'+esc(sig)+'</div><div class="metric"><span class="muted">Confidence</span><b>'+pct(v.confidence)+'</b></div><div class="metric"><span class="muted">R:R</span><b>'+(v.risk_reward==null?"—":Number(v.risk_reward).toFixed(2))+'</b></div><div class="metric"><span class="muted">Valid until</span><b style="font-size:13px">'+esc(v.valid_until)+'</b></div></div>'+
   '<div class="levels"><div class="level"><span class="muted">ENTRY</span><b>'+price(v.entry)+'</b></div><div class="level"><span class="muted">STOP LOSS</span><b>'+price(v.stop_loss)+'</b></div><div class="level"><span class="muted">TARGET</span><b>'+price(v.target)+'</b></div><div class="level"><span class="muted">AUTHORITY</span><b style="font-size:12px">'+esc(v.authority)+'</b></div></div>'+
   '<div class="section"><h2>Prediction evidence</h2><div class="row"><span class="metric"><span class="muted">Long</span><b>'+pct(p.LONG_SUCCESS)+'</b></span><span class="metric"><span class="muted">Short</span><b>'+pct(p.SHORT_SUCCESS)+'</b></span><span class="metric"><span class="muted">No edge</span><b>'+pct(p.NO_EDGE)+'</b></span><span class="metric"><span class="muted">Class</span><b style="font-size:13px">'+esc(v.prediction_evidence&&v.prediction_evidence.class)+'</b></span></div></div>'+
 '</section>'+
 '<section class="panel"><div class="kicker">REVIEW GATES</div><div class="section"><h2>Risk conditions</h2><div class="pills">'+(risk||'<span class="muted">None recorded.</span>')+'</div></div><div class="section"><h2>Supporting factors</h2>'+pills(v.supporting_factors,"support")+'</div><div class="section"><h2>Contradicting factors</h2>'+pills(v.contradicting_factors,"contra")+'</div><div class="section"><h2>Identity</h2><div class="kv"><b>Signal ID</b><span>'+esc(v.signal_id)+'</span></div><div class="kv"><b>Fingerprint</b><span>'+esc(v.fingerprint)+'</span></div></div></section>'+
 '<section class="panel full"><div class="kicker">EVIDENCE CHAIN</div><div class="section"><h2>News / Research</h2>'+evidence(v.news_research_evidence)+'</div><div class="section"><h2>Technical</h2>'+evidence(v.technical_evidence)+'</div><div class="section"><h2>Fundamental</h2>'+evidence(v.fundamental_evidence)+'</div><div class="section"><h2>Market / Sector</h2>'+evidence(v.market_sector_evidence)+'</div></section>'+
 '<section class="panel"><div class="kicker">MODEL / DATA PROVENANCE</div><div class="section">'+prov+'</div></section>'+
 '<section class="panel"><div class="kicker">RAW CANONICAL CONTRACT</div><pre>'+esc(JSON.stringify(v,null,2))+'</pre></section>';
 fresh.textContent=v.is_expired?"EXPIRED":"VALID";
 fresh.className="badge "+(v.is_expired?"locked":"");
}
async function poll(){
 try{const r=await fetch("/api/snapshot",{cache:"no-store"});if(!r.ok)return;const s=await r.json();render(s)}
 catch(_e){}
}
if(location.protocol!=="file:"){poll();setInterval(poll,2000)}
</script>
</body>
</html>
