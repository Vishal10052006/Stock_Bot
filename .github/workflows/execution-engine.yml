name: Execution Engine Production Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "execution/**"
      - "tests/execution/**"
      - "paper/**"
      - "backtesting/**"
      - "monitoring/**"
      - "docs/EXECUTION_ENGINE.md"
      - "docs/EXECUTION_CERTIFICATION_EVIDENCE.md"
      - "requirements-execution.txt"
      - "requirements-screen-observer.txt"
      - "learning/**"
      - "tests/learning/**"
      - "multi_stock/**"
      - "desktop/**"
      - "dashboard/**"
      - "scripts/serve_operator_dashboard.py"
      - "scripts/validate_virtual_session.py"
      - "scripts/cert08_paper_soak.py"
      - "tests/dashboard/**"
      - "tests/multi_stock/**"
      - "tests/desktop/**"
      - "docs/OPERATOR_DASHBOARD_RUNTIME.md"
      - "docs/CERT08_PAPER_SOAK_RUNBOOK.md"
      - ".github/workflows/execution-engine.yml"
  push:
    branches:
      - main
      - feat/execution-certification-cert01-cert12
      - feat/screen-observer-foundation
    paths:
      - "execution/**"
      - "tests/execution/**"
      - "paper/**"
      - "backtesting/**"
      - "monitoring/**"
      - "docs/EXECUTION_ENGINE.md"
      - "docs/EXECUTION_CERTIFICATION_EVIDENCE.md"
      - "requirements-execution.txt"
      - "requirements-screen-observer.txt"
      - "multi_stock/**"
      - "desktop/**"
      - "dashboard/**"
      - "scripts/serve_operator_dashboard.py"
      - "scripts/validate_virtual_session.py"
      - "scripts/cert08_paper_soak.py"
      - "tests/dashboard/**"
      - "tests/multi_stock/**"
      - "tests/desktop/**"
      - "docs/OPERATOR_DASHBOARD_RUNTIME.md"
      - "docs/CERT08_PAPER_SOAK_RUNBOOK.md"
      - ".github/workflows/execution-engine.yml"

jobs:
  execution-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest scipy scikit-learn requests pydantic fastapi sqlalchemy alembic python-dotenv yfinance ta joblib pyarrow
          python -m pip install -r requirements-execution.txt
          python -m pip install -r requirements-screen-observer.txt
      - name: Certification matrix validation
        run: python -m pytest -q tests/execution/test_certification_matrix.py
      - name: Module 10 readiness audit
        run: PYTHONPATH=. python scripts/audit_module10_readiness.py --json || test $? -eq 1
      - name: Execution production validation
        run: python -m pytest -q tests/execution
      - name: Full repository regression
        run: python -m pytest -q
