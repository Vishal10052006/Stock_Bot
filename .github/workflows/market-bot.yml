name: market-bot-tests

on:
  push:
    branches:
      - feat/market-bot-production
  pull_request:
    branches:
      - main

jobs:
  market-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas pytest
      - name: Market Bot tests
        run: python -m pytest tests/market_bot/test_market_bot.py -q
