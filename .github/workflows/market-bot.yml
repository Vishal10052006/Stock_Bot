name: market-bot-tests

on:
  push:
    branches:
      - feat/market-bot-production
  pull_request:
    branches:
      - main

jobs:
  market-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest scipy scikit-learn requests pydantic fastapi sqlalchemy alembic python-dotenv yfinance ta joblib pyarrow
      - name: Market Bot tests
        run: python -m pytest tests/market_bot/test_market_bot.py -q
      - name: Full regression
        run: python -m pytest -q
