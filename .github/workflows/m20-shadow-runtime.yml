name: M20 Shadow Runtime Validation

on:
  pull_request:
    paths:
      - "runtime/**"
      - "scripts/run_m20_shadow.py"
      - "scripts/smoke_test_upstox_feed.py"
      - "market/data/**"
      - "market/candles/**"
      - "tests/test_m20_shadow_runtime.py"
      - "tests/test_m20_shadow_runtime_lifecycle.py"
      - "tests/test_m20_shadow_candles.py"
      - "tests/test_m20_shadow_decision.py tests/test_m20_research_runtime.py"
      - "tests/test_m20_research_runtime.py"
  push:
    branches:
      - feat/m20-shadow-runtime

jobs:
  m20-shadow-runtime:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest requests protobuf websocket-client

      - name: M20 safety and lifecycle tests
        run: python -m pytest -q tests/test_m20_shadow_runtime.py tests/test_m20_shadow_runtime_lifecycle.py tests/test_m20_shadow_candles.py tests/test_m20_shadow_decision.py

      - name: Compile M20 runtime
        run: |
          python -m py_compile             runtime/__init__.py             runtime/mode.py             runtime/config.py             runtime/health.py             runtime/shadow_runtime.py             scripts/run_m20_shadow.py
