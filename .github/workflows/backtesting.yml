name: Backtesting Validation

on:
  push:
    branches:
      - phase-12/backtesting-v1-final
  pull_request:

jobs:
  backtesting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest

      - name: Run Phase 12 and Risk regression
        run: |
          python -m pytest -q             tests/backtesting             tests/risk/test_risk_engine.py             tests/risk/test_risk_engine_phase11.py

      - name: Run full repository regression
        run: python -m pytest -q
