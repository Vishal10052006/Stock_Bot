name: Risk Engine Validation

on:
  push:
    branches:
      - risk-engine/r0-r20
  pull_request:

jobs:
  risk-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Risk Engine test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest

      - name: Run Risk Engine tests
        run: python -m pytest -q tests/test_risk_gate.py tests/test_risk_engine.py
