name: desktop-tests

on:
  push:
    paths:
      - "desktop/**"
      - "tests/desktop/**"
      - ".github/workflows/desktop-tests.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "tests/desktop/**"
      - ".github/workflows/desktop-tests.yml"

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest numpy pandas yfinance scikit-learn scipy ta pyarrow
      - run: python -m pytest -q tests/desktop
