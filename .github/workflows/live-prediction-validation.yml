name: live-prediction-validation

on:
  push:
    branches:
      - main
      - feat/live-prediction-validation
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest scipy scikit-learn requests pydantic fastapi sqlalchemy alembic python-dotenv yfinance ta joblib pyarrow
      - name: Live validation tests
        run: python -m pytest -q tests/test_live_prediction_validation.py tests/test_live_prediction_bridge.py
      - name: Contract smoke
        run: python scripts/validate_live_prediction_components.py
